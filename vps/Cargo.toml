[package]
name = "vps-service"
version = "0.1.0"
edition = "2021"
publish = false
description = "datxevui's VPS companion: OpenStreetMap place indexing, place search and the Worker's cron driver"

[workspace]

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
croner = "4"
deunicode = "1"
fst = { version = "0.4", features = ["levenshtein"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
indexmap = "2"
libc = "0.2"
md-5 = "0.10"
place-extract = { path = "../tools/place-extract" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "process", "fs", "sync"] }
toml = "1"
unicode-normalization = "0.1"
tower-http = { version = "0.7", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
