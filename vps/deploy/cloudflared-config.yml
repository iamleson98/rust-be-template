# Cloudflare Tunnel: the only way in to the service (it listens on loopback).
# Copy to /etc/cloudflared/config.yml after `cloudflared tunnel create vps`,
# replace <TUNNEL_ID>, then `cloudflared tunnel route dns vps vps.datxevui.com`
# and `cloudflared service install`. See vps/README.md.
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: vps.datxevui.com
    service: http://127.0.0.1:8787
    originRequest:
      connectTimeout: 5s
  - service: http_status:404
