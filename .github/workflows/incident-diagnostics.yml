name: Incident Diagnostics (temporary)

# TEMPORARY read-only production diagnostics via the deploy SSH channel.
# Same access path as deploy.yml (SERVER_HOST/SERVER_USER/SERVER_SSH_KEY secrets).
# Manual trigger only (workflow_dispatch). Master pushes do NOT deploy
# (deploys are tag-driven, `v*` only), so this is safe to iterate on.

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Bash script to run on the server (overrides the default diagnostic bundle)'
        required: false
        default: ''

env:
  DEFAULT_SCRIPT: |
    set +e
    echo "=== identity ==="
    whoami; hostname; uptime
    echo "=== docker services ==="
    docker service ls 2>/dev/null
    echo "=== stack tasks (vexevn) ==="
    docker stack ps vexevn --no-trunc 2>/dev/null | head -30
    echo "=== running containers ==="
    docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run diagnostics on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script_stop: false
          script: ${{ github.event.inputs.script || env.DEFAULT_SCRIPT }}

      - name: Summary
        run: echo "Diagnostics complete — see step log above."
