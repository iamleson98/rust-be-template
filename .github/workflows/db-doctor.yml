name: DB Doctor

# TEMPORARY incident-response workflow (read-only diagnostics on the
# production node). DELETE after the incident is closed.
on: workflow_dispatch

jobs:
  doctor:
    name: Read-only prod diagnostics v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH + run diagnostics v2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          command_timeout: 10m
          script: |
            set +e
            CID=$(docker ps -q --filter "name=datxevui_backend" | head -n1)
            echo "##### container: $CID"

            echo "##### SECTION: backend startup logs (first 80 lines of current task)"
            docker logs "$CID" 2>&1 | head -80

            echo "##### SECTION: error context in logs (salt/store_error, with 2 lines around)"
            docker logs "$CID" 2>&1 | grep -n -iE "salt|store_error|corrupt|engine|pragma|migrat" | head -40

            echo "##### SECTION: open file descriptors of backend PID 1 (db-related)"
            docker exec "$CID" sh -c 'ls -l /proc/1/fd 2>/dev/null | grep -iE "wal|\.db|rsql|tmp|shm|spill"; echo "--- all fd count:"; ls /proc/1/fd 2>/dev/null | wc -l'

            echo "##### SECTION: /app/data right now"
            docker exec "$CID" ls -la /app/data

            echo "##### SECTION: maps of deleted files"
            docker exec "$CID" sh -c 'ls -l /proc/1/fd 2>/dev/null | grep deleted'

            echo "##### SECTION: journal-mode related strings in process env"
            docker exec "$CID" sh -c 'strings /proc/1/environ | grep -iE "DATABASE|POOL|LIFETIME|IDLE"'

            echo "##### SECTION: recent log tail (60)"
            docker logs "$CID" 2>&1 | tail -60

            echo "##### DONE"
