name: DB Doctor

# TEMPORARY incident-response workflow (read-only diagnostics on the
# production node). DELETE after the incident is closed.
on: workflow_dispatch

jobs:
  doctor:
    name: Read-only prod diagnostics v4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH + run diagnostics v4
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          command_timeout: 10m
          script: |
            set +e
            CID=$(docker ps -q --filter "name=datxevui_backend" | head -n1)
            echo "##### container: $CID"

            echo "##### SECTION: process cmdlines"
            for p in $(docker exec "$CID" sh -c 'ls /proc | grep -E "^[0-9]+$"' | head -8); do
              echo "PID $p: $(docker exec "$CID" sh -c "tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null")"
            done

            echo "##### SECTION: fds of backend (pid 6 and all)"
            for p in $(docker exec "$CID" sh -c 'ls /proc | grep -E "^[0-9]+$"' | head -8); do
              OUT=$(docker exec "$CID" sh -c "ls -l /proc/$p/fd 2>/dev/null" | grep -iE "wal|\.db|rsql|tmp|shm|spill|deleted")
              if [ -n "$OUT" ]; then
                echo "--- PID $p db-related fds:"
                echo "$OUT"
              fi
            done

            echo "##### SECTION: fd count per pid"
            for p in $(docker exec "$CID" sh -c 'ls /proc | grep -E "^[0-9]+$"' | head -8); do
              echo "PID $p: $(docker exec "$CID" sh -c "ls /proc/$p/fd 2>/dev/null | wc -l") fds"
            done

            echo "##### DONE"
