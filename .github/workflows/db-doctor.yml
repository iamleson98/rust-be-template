name: DB Doctor

# TEMPORARY incident-response workflow on the production node.
# Phase B: restart the backend with the recovered WAL in place.
# DELETE after the incident is closed.
on: workflow_dispatch

jobs:
  doctor:
    name: Incident recovery phase B (restart)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH + recover and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          command_timeout: 15m
          script: |
            set +e
            VOL=$(docker volume inspect datxevui_vexevn-data --format '{{.Mountpoint}}')
            BDIR=/opt/vexevn/backups/incident-20260918T143847Z
            echo "##### volume: $VOL"
            echo "##### backups: $BDIR"
            ls -la "$BDIR"

            echo "##### SECTION: stop backend service"
            docker service scale datxevui_backend=0
            for i in $(seq 1 40); do
              n=$(docker ps -q --filter "name=datxevui_backend" | wc -l)
              [ "$n" -eq 0 ] && break
              sleep 2
            done
            echo "tasks still running: $(docker ps -q --filter 'name=datxevui_backend' | wc -l)"
            sleep 5

            echo "##### SECTION: post-stop volume state"
            ls -la "$VOL"
            stat -c '%n %s mtime=%y' "$VOL/app.db"

            echo "##### SECTION: place recovered WAL"
            cp "$BDIR/wal-snapshot.bin" "$VOL/app.db-wal"
            chown 1000:1000 "$VOL/app.db-wal"
            chmod 644 "$VOL/app.db-wal"
            rm -f "$VOL/wal-snapshot.bin"
            ls -la "$VOL"
            echo "--- placed wal header:"
            od -A d -t x1 -v -N 32 "$VOL/app.db-wal"

            echo "##### SECTION: pool-lifetime mitigation + restart"
            docker service update --env-add DATABASE_MAX_LIFETIME_SECS=2592000 --env-add DATABASE_IDLE_TIMEOUT_SECS=3600 datxevui_backend 2>&1 | tail -2
            docker service scale datxevui_backend=1

            echo "##### SECTION: wait for healthy task"
            for i in $(seq 1 60); do
              H=$(docker ps -q --filter "name=datxevui_backend" --filter "health=healthy" | wc -l)
              [ "$H" -ge 1 ] && break
              sleep 2
            done
            echo "healthy tasks: $(docker ps -q --filter 'name=datxevui_backend' --filter 'health=healthy' | wc -l)"
            echo "running tasks: $(docker ps -q --filter 'name=datxevui_backend' | wc -l)"

            echo "##### SECTION: new task inspection"
            CID2=$(docker ps -q --filter "name=datxevui_backend" | head -n1)
            echo "new container: $CID2"
            docker exec "$CID2" ls -la /app/data
            echo "--- startup log lines:"
            docker logs "$CID2" 2>&1 | grep -iE "error|salt|corrupt|migrat|engine|pragma|starting" | head -15
            echo "--- backend fds:"
            docker exec "$CID2" sh -c 'ls -l /proc/6/fd 2>/dev/null | grep -iE "wal|db"; ls -l /proc/7/fd 2>/dev/null | grep -iE "wal|db"'
            echo "--- env check:"
            docker exec "$CID2" sh -c 'env | grep -iE "DATABASE_MAX|DATABASE_IDLE"'

            echo "##### DONE"
