# ─── Production release: push a tag vX.Y.Z ───────────────────────────
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# 1. vps.yml: fmt, clippy, tests and a real-data index run of the VPS
#    service; its binary is signed (RELEASE_SIGNING_KEY) and attached to the
#    tag's GitHub release.
# 2. Cloudflare: cloudflare-deploy.yml (tests → D1 migrations → Worker
#    deploy → /health).
# 3. The VPS installs the release itself within 5 minutes: its
#    vps-service-update timer finds the new tag, checks the SHA-256 and the
#    signature against the key it pins, swaps the binary, and rolls back if
#    the service does not come up. Nothing can reach into the VPS to deploy.
#    The Worker falls back to its static index and own cron trigger meanwhile.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, RELEASE_SIGNING_KEY.
# Variable: SITE_URL (health check).

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vps-build:
    name: VPS service
    uses: ./.github/workflows/vps.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: write
    secrets: inherit

  web:
    name: Deploy the Cloudflare app
    needs: vps-build
    uses: ./.github/workflows/cloudflare-deploy.yml
    secrets: inherit
