# ─── CD: build Docker image + push to GHCR + deploy to Contabo ────────
#
# Trigger: pushing a version tag. Every release is a tag:
#   git tag v1.2.3 && git push origin v1.2.3
#
# Pipeline:
#   1. build-and-push — multi-stage Dockerfile builds the Vite frontend
#      (bun) AND the Rust backend, producing ONE image where the backend
#      serves the static frontend on :8080 (plus API + WS + Tantivy
#      search). Pushed to ghcr.io tagged with the semver + latest + sha.
#   2. deploy — SSHes into the Contabo VPS, syncs the compose stack,
#      pulls the new image, recreates the backend, and waits for
#      /health. Volumes (SQLite data, Tantivy index, uploads) persist
#      across releases by design.
#
# Required GitHub repository secrets:
#   SERVER_HOST      — Contabo VPS public IP or hostname
#   SERVER_USER      — SSH user (root or a sudo-capable user)
#   SERVER_SSH_KEY   — SSH PRIVATE key (OpenSSH PEM format)
# Optional:
#   GHCR_USER + GHCR_TOKEN — only if the GHCR package stays PRIVATE
#                            (a PAT with read:packages). For public
#                            packages, anonymous pulls just work.
#   DEPLOY_DIR       — GitHub VARIABLE (not secret) for the stack dir,
#                      default /opt/vexevn
#
# First-time server prep: run deploy/server-init.sh once on the VPS
# (installs Docker, writes .env with a random JWT_SECRET + TUNNEL_TOKEN,
# locks the firewall). See deploy/README.md.

name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build + Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=commit-

      - name: Resolve deployed image ref + build timestamp
        id: image
        # Tag push → exact semver (e.g. :1.2.3); manual run → input tag.
        # metadata-action lowercases the image path — match it here
        # (matters for owners/repos with uppercase letters). It also has
        # no `date` output, so we stamp the build timestamp ourselves.
        run: |
          REPO_LC="${IMAGE_NAME,,}"
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${REPO_LC}:${{ steps.meta.outputs.version }}"
          else
            REF="${REPO_LC}:${{ github.event.inputs.image_tag }}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "deploying ${REF}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64   # Contabo VPSes are x86_64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BACKEND_FEATURES=sqlite
            VERSION=${{ steps.meta.outputs.version }}
            CREATED=${{ steps.image.outputs.created }}

  deploy:
    name: Deploy to Contabo
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.image_tag != '' }}
    # Skip gracefully on repos without the server secrets configured yet
    # (lets the build+push half run for forks / before server prep).
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/vexevn' }}
    steps:
      - name: Guard — server secrets present?
        id: guard
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SERVER_HOST secret not set — skipping the deploy step (image is on GHCR)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'

      - name: Sync compose stack to the server
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/docker-compose.contabo.yml,deploy/Caddyfile.cloudflare,deploy/import-osm.sh"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Deploy + verify health
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE,DEPLOY_DIR,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            COMPOSE="docker compose -f docker-compose.contabo.yml"

            # ── Optional GHCR login (private packages only) ──
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            # ── Record the running image for a documented rollback ──
            PREV_IMAGE=$(docker inspect --format '{{.Config.Image}}' \
              "$($COMPOSE ps -q backend 2>/dev/null)" 2>/dev/null || echo "(none)")
            echo "previous image: $PREV_IMAGE"

            # ── Surface an unconfigured tunnel token (non-fatal) ──
            if grep -q '^TUNNEL_TOKEN=PASTE_TUNNEL_TOKEN_HERE' .env 2>/dev/null; then
              echo "WARNING: TUNNEL_TOKEN is still the placeholder — the tunnel will not connect."
              echo "  fix: edit $DEPLOY_DIR/.env, then: $COMPOSE up -d cloudflared"
            fi

            # ── Pull + recreate (volumes persist: data, index, storage) ──
            echo "deploying $IMAGE"
            APP_IMAGE="$IMAGE" $COMPOSE pull backend
            APP_IMAGE="$IMAGE" $COMPOSE up -d --remove-orphans

            # ── Wait for /health on the NEW container ──
            echo "waiting for health check..."
            for i in $(seq 1 45); do
              if $COMPOSE exec -T backend curl -sf http://localhost:8080/health >/dev/null 2>&1; then
                echo "healthy after ~$((i*2))s"
                $COMPOSE ps
                docker image prune -f >/dev/null
                echo "deployed: $IMAGE"
                exit 0
              fi
              sleep 2
            done

            echo "health check FAILED — last 80 log lines:"
            $COMPOSE logs --tail 80 backend || true
            echo "rollback:  APP_IMAGE=$PREV_IMAGE $COMPOSE up -d"
            exit 1
