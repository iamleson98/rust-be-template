# ─── CD: build Docker image + push to GHCR + deploy ─────────────────
#
# On push to `server` branch:
#   1. Builds the multi-stage Docker image (frontend + backend)
#   2. Pushes to GitHub Container Registry (ghcr.io)
#   3. SSHs into the Kamatera VM and runs docker compose pull + up
#
# Required GitHub repository secrets:
#   VM_HOST          — Kamatera VM public IP (or domain)
#   VM_SSH_KEY       — SSH private key for the VM (PEM format)
#   VM_USER          — SSH user (usually "root")

name: Deploy

on:
  push:
    branches: [server]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vexevn

jobs:
  build-and-push:
    name: Build + Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=commit-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BACKEND_FEATURES=sqlite

  deploy:
    name: Deploy to Kamatera
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/server'
    steps:
      - uses: actions/checkout@v4

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.prod.yml,.env.example"
          target: "/opt/vexevn"

      - name: Deploy and verify
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            cd /opt/vexevn

            # Login to GHCR
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # Pull the latest image
            echo "📦 Pulling image: ${IMAGE}"
            docker pull "${IMAGE}"

            # Ensure .env exists (create from example on first run)
            if [ ! -f .env ]; then
              echo "📝 Creating .env from .env.example..."
              cp .env.example .env
              JWT_SECRET=$(openssl rand -hex 32)
              sed -i "s|^JWT__SECRET=.*|JWT__SECRET=${JWT_SECRET}|g" .env
              sed -i 's|^COOKIE__SECURE=.*|COOKIE__SECURE=true|g' .env
              sed -i 's|^CORS__ORIGINS=.*|CORS__ORIGINS=https://yourdomain.com|g' .env
              echo "✅ .env created with secure defaults"
            fi

            # Stop old container
            echo "🛑 Stopping previous deployment..."
            docker compose -f docker-compose.prod.yml down 2>/dev/null || true

            # Start new container
            echo "🚀 Starting new deployment..."
            docker compose -f docker-compose.prod.yml up -d

            # Wait for container to be ready
            echo "⏳ Waiting for health check..."
            sleep 10
            
            # Health check
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "✅ Deployment successful!"
              docker compose -f docker-compose.prod.yml ps
            else
              echo "❌ Health check failed"
              docker compose -f docker-compose.prod.yml logs --tail 50
              exit 1
            fi
