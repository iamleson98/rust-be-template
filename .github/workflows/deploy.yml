# ─── CD: build Docker image + push to GHCR + deploy ─────────────────
#
# On push to `server` branch:
#   1. Builds the multi-stage Docker image (frontend + backend)
#   2. Pushes to GitHub Container Registry (ghcr.io)
#   3. SSHs into the Kamatera VM and runs docker compose pull + up
#
# Required GitHub repository secrets:
#   VM_HOST          — Kamatera VM public IP (or domain)
#   VM_SSH_KEY       — SSH private key for the VM (PEM format)
#   VM_USER          — SSH user (usually "root")

name: Deploy

on:
  push:
    branches: [server]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vexevn

jobs:
  build-and-push:
    name: Build + Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=commit-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BACKEND_FEATURES=sqlite

  deploy:
    name: Deploy to Kamatera
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/server'
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          IMAGE: ${{ env.IMAGE_NAME }}:latest
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE
          script: |
            mkdir -p /opt/vexevn
            cd /opt/vexevn

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest image
            docker pull $IMAGE:latest

            # Ensure .env exists (create from example on first run)
            if [ ! -f .env ]; then
              echo "Creating .env from .env.example..."
              # Download .env.example from the repo
              curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/server/.env.example" -o .env
              JWT_SECRET=$(openssl rand -hex 32)
              sed -i "s|^JWT__SECRET=.*|JWT__SECRET=${JWT_SECRET}|g" .env
              sed -i 's|^COOKIE__SECURE=.*|COOKIE__SECURE=false|g' .env
              sed -i 's|^CORS__ORIGINS=.*|CORS__ORIGINS=*|g' .env
              echo "✅ .env created"
            fi

            # Stop old container
            docker compose -f docker-compose.prod.yml down 2>/dev/null || true

            # Write the compose file from repo
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/server/docker-compose.prod.yml" -o docker-compose.prod.yml

            # Start new container
            docker compose -f docker-compose.prod.yml up -d

            # Wait + health check
            sleep 10
            if curl -sf http://localhost:8080/health; then
              echo "✅ Deployed successfully"
            else
              echo "❌ Health check failed — check logs:"
              docker compose -f docker-compose.prod.yml logs --tail 50
              exit 1
            fi
