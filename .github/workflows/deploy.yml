# ─── CD: build Docker image + push to GHCR + deploy to prod ────────
#
# Trigger: pushing a version tag. Every release is a tag:
#   git tag v1.2.3 && git push origin v1.2.3
#
# Pipeline:
#   1. build-and-push — multi-stage Dockerfile builds the Vite frontend
#      (bun) AND the Rust backend, producing ONE image where the backend
#      serves the static frontend on :8080 (plus API + WS + Tantivy
#      search). Pushed to ghcr.io tagged with the semver + latest + sha.
#      NO code is built on the server.
#   2. deploy — SSHes into the production Swarm node, syncs
#      deploy/{stack.yml,deploy.sh,Caddyfile.datxevui}, and runs
#      deploy.sh: docker stack deploy (pulls the image from GHCR),
#      guarantees exactly one datxevui.com site block in the shared
#      Caddyfile (validated before swap, in-place write), hot-reloads
#      Caddy, and waits for /health. Volumes (rust-sql DB, Tantivy
#      index, uploads) persist across releases by design.
#
# Production topology (datxevui.com):
#   Shared Swarm manager already running the pdf-tts stack. The
#   datxevui stack's backend joins the pdf-tts_pdf-tts overlay network;
#   the existing Caddy (owns :80/:443) proxies datxevui.com →
#   datxevui_backend:8080 with automatic Let's Encrypt TLS.
#
# Required GitHub repository secrets:
#   SERVER_HOST      — server public IP or hostname
#   SERVER_USER      — SSH user (root or a sudo-capable user)
#   SERVER_SSH_KEY   — SSH PRIVATE key (OpenSSH format)
# Optional:
#   GHCR_USER + GHCR_TOKEN — only if the GHCR package stays PRIVATE and
#                            the node has no stored ghcr.io credentials.
#   DEPLOY_DIR       — GitHub VARIABLE (not secret) for the stack dir,
#                      default /opt/vexevn
#
# Server prerequisites: Docker Swarm manager + shared Caddy already
# running (see deploy/README.md). DNS: A records datxevui.com and
# www.datxevui.com → the server IP (Caddy then auto-issues certs).

name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build + Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The sqlite engine (rust-sql) is a git submodule baked into the
          # image via [patch.crates-io] — the build context needs it.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=commit-

      - name: Resolve deployed image ref + build timestamp
        id: image
        # Tag push → exact semver (e.g. :1.2.3); manual run → input tag.
        # metadata-action lowercases the image path — match it here
        # (matters for owners/repos with uppercase letters). It also has
        # no `date` output, so we stamp the build timestamp ourselves.
        run: |
          REPO_LC="${IMAGE_NAME,,}"
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${REPO_LC}:${{ steps.meta.outputs.version }}"
          else
            REF="${REPO_LC}:${{ github.event.inputs.image_tag }}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "deploying ${REF}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64   # Contabo VPSes are x86_64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            CREATED=${{ steps.image.outputs.created }}

  deploy:
    name: Deploy (Swarm + shared Caddy)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.image_tag != '' }}
    # Skip gracefully on repos without the server secrets configured yet
    # (lets the build+push half run for forks / before server prep).
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/vexevn' }}
    steps:
      - name: Guard — server secrets present?
        id: guard
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SERVER_HOST secret not set — skipping the deploy step (image is on GHCR)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'

      - name: Sync swarm stack to the server
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/stack.yml,deploy/deploy.sh,deploy/Caddyfile.datxevui"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Deploy + verify health
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE,DEPLOY_DIR,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            # deploy.sh: stack deploy → Caddy site block + hot reload →
            # health gate on the new task; logs + rollback hint on failure.
            bash deploy.sh
