# ─── CI: the quality harness ──────────────────────────────────────────
#
# TRIGGER DESIGN — "verify once, at the door" (docs/CI.md § Trigger):
#   * pull_request (master) — THE gate. Actions checks out the MERGE REF
#     (refs/pull/N/merge = PR rebased onto the current master tip), so CI
#     validates the exact tree a merge would produce. Strict up-to-date
#     branch protection re-verifies at merge time: what CI gated here IS
#     what lands on master.
#   * merge_group — merge-queue-ready: if a queue is ever enabled in repo
#     Settings, these same jobs gate the queued batch. Costs nothing while
#     no queue exists (the event simply never fires).
#   * schedule (Mon 03:00 UTC) — weekly drift canary on master: every
#     backend job builds against UPSTREAM rust-sql master ("the engine
#     rides master") and CVE advisories accumulate over time — this
#     surfaces both within 7 days even when no PR touched the repo. It is
#     drift detection, NOT a re-verification of merged code.
#   * workflow_dispatch — manual full-matrix escape hatch.
#   * NO `push` trigger: a post-merge run on master would re-validate a
#     tree the PR run already gated (the duplicate runs this design
#     eliminated). Deploy stays tag-driven (deploy.yml, `v*`) — master
#     pushes never deploy.
#
# PATH FILTERING: the `changes` job classifies the diff and each stack
# job runs only when its files changed. Skipped jobs report conclusion
# "skipped", which branch protection counts as success (GitHub-documented
# behavior) — the required checks keep working. The classifier is
# fail-safe: anything unclassifiable (or schedule/dispatch events) runs
# the FULL matrix. `changes` itself is a required check — if the
# classifier fails, dependent jobs skip and the PR stays blocked
# (fail-closed: a broken filter can never silently disarm the gates).
#
# Each stack job is independent — failures don't block the others (so a
# frontend type error won't hide a Rust clippy warning).
#
# The harness enforces, per stack:
#
#   0. changes           — diff path classifier (see PATH FILTERING)
#
#   BACKEND (Rust)
#   1. backend          — rustfmt · cargo check · clippy -D warnings ·
#                          cargo test · doctests · rustdoc -D warnings ·
#                          OpenAPI spec drift (frontend/openapi.json must
#                          match the compiled-in API surface)
#   2. backend-audit    — cargo audit (RustSec CVEs, --deny warnings)
#   3. backend-quality  — cargo-deny (advisories/licenses/sources) ·
#                          cargo-machete (unused deps) · taplo (TOML fmt)
#
#   FRONTEND (React/TS)
#   4. frontend         — prettier --check · eslint --max-warnings 0 ·
#                          tsc --noEmit (src + e2e + configs) · OpenAPI
#                          SDK freshness · knip (unused files/deps) ·
#                          vitest · vite build + prerender
#   5. frontend-e2e     — Playwright chromium suite (dev server started
#                          by Playwright itself; zero API calls)
#
#   MOBILE (Flutter)
#   6. mobile           — dart format --check · flutter analyze
#                          --fatal-infos · flutter test · debug APK build
#
#   REPO
#   7. repo-hygiene     — actionlint (workflows) · shellcheck -S warning
#                          (all *.sh) · hadolint (Dockerfile) ·
#                          markdownlint-cli2 (all *.md) · JSON validity
#   8. secrets-scan     — gitleaks + known-leaked-pattern regression grep
#   9. docker-build     — Dockerfile builds end-to-end (smoke)
#
#   SECURITY (separate file: codeql.yml)
#  10. CodeQL           — rust + javascript-typescript semantic analysis
#
# Releases/deployments are tag-driven — see deploy.yml (push tag `v*`).
# Required-check branch protection on master references the job names
# below — keep them in sync if renaming (see docs/CI.md).

name: CI

on:
  # The ONLY binding gate: PRs targeting master. Pre-PR feedback on a
  # feature branch = open a (draft) PR — it triggers the same matrix.
  pull_request:
    branches: [master]
  # Merge-queue-ready (no-op until a queue is enabled in repo Settings).
  merge_group:
    types: [checks_requested]
    branches: [master]
  # Weekly drift canary (engine-upstream + advisory drift on master).
  schedule:
    - cron: '0 3 * * 1'  # Mondays 03:00 UTC, off-peak
  workflow_dispatch:

# Superseded runs on the same ref are cancelled — keeps the queue fast
# when several pushes land in quick succession.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  # ── Diff classifier ──────────────────────────────────────────────
  # Runs on EVERY trigger (~30s). Downstream stack jobs skip when their
  # files didn't change; "skipped" satisfies required status checks.
  # THIS job is itself a required check → fail-closed by design.
  changes:
    name: Changes (path filter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
      run_all: ${{ steps.filter.outputs.run_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the diff needs the merge-base with the base tip.
          fetch-depth: 0

      - name: Classify changed files per stack
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          # Default posture: RUN EVERYTHING. Only a successfully classified
          # diff may turn a stack off — an unclassifiable change (or any
          # error in this script → job fails → required check red) must
          # never skip a gate.
          backend=true
          frontend=true
          mobile=true
          docker=true
          run_all=true

          base=""
          case "$EVENT" in
            pull_request)
              # Fetch the CURRENT base tip (not the PR-open-time sha) —
              # with strict up-to-date protection the merge ref HEAD is
              # built against exactly this tip.
              git fetch --no-tags origin "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/base"
              base="refs/remotes/origin/base"
              ;;
            merge_group)
              base="$MG_BASE_SHA"
              ;;
            *)
              # schedule / workflow_dispatch → full matrix (drift canary
              # + manual runs). Defaults above already say "run all".
              echo "event '$EVENT' → running the full matrix"
              ;;
          esac

          if [ -n "$base" ]; then
            # HEAD here is the merge ref (pull_request) or the queued
            # batch head (merge_group) — three-dot diff = the change's own
            # contribution against the merge-base.
            files=$(git diff --name-only "$base"...HEAD)

            backend=false
            frontend=false
            mobile=false
            docker=false
            run_all=false

            backend_rx='(^|/)(Cargo\.toml|Cargo\.lock|deny\.toml|taplo\.toml|rust-toolchain[^/]*|\.rustfmt\.toml|clippy\.toml)$|^\.cargo/|^rust-sql$|\.rs$|^frontend/openapi\.json$'
            frontend_rx='^frontend/'
            mobile_rx='^mobile/'
            docker_rx='^(Dockerfile|\.dockerignore)$'
            ci_rx='^\.github/'
            # Files that gate NOTHING heavy — repo-hygiene and secrets-scan
            # always run and cover exactly these classes.
            light_rx='\.md$|^\.markdownlint-cli2\.yaml$|^\.hadolint\.yaml$|^\.gitleaksignore$|^LICENSE'

            if printf '%s\n' "$files" | grep -Eq "$backend_rx";  then backend=true;  fi
            # .md under a stack dir is docs, not code (frontend/README.md
            # edits must not spin up the whole frontend stack).
            if printf '%s\n' "$files" | grep -E "$frontend_rx" | grep -Evq '\.md$'; then frontend=true; fi
            if printf '%s\n' "$files" | grep -E "$mobile_rx"   | grep -Evq '\.md$'; then mobile=true;   fi
            if printf '%s\n' "$files" | grep -Eq "$docker_rx";   then docker=true;   fi
            if printf '%s\n' "$files" | grep -Eq "$ci_rx";       then run_all=true;  fi

            # Fail-safe catch-all: a file outside EVERY known class (docs/,
            # Makefile, scripts/, deploy/, terraform/, configs, …) runs the
            # whole matrix — unknown ⇒ expensive, never blind.
            classified_rx="${backend_rx}|${frontend_rx}|${mobile_rx}|${docker_rx}|${ci_rx}|${light_rx}"
            if printf '%s\n' "$files" | grep -Evq "$classified_rx"; then
              run_all=true
            fi

            echo "── changed files (vs $base):"
            printf '%s\n' "$files" | sed 's/^/   /' || true
          fi

          echo "── stack selection: backend=$backend frontend=$frontend mobile=$mobile docker=$docker run_all=$run_all"
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "mobile=$mobile"
            echo "docker=$docker"
            echo "run_all=$run_all"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (Rust)
    needs: changes
    if: |
      needs.changes.outputs.run_all == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The sqlite engine (rust-sql) is a git submodule — required for
          # the [patch.crates-io] libsqlite3-sys → rustqlite-compat path.
          submodules: recursive

      - name: Pull latest rust-sql engine (master)
        # The submodule pin records the last human-reviewed engine commit,
        # but the engine evolves independently — CI must exercise the
        # NEWEST master so integration breakage surfaces here (type
        # errors, clippy lints, test failures), not in production.
        # rust-sql is a public repo → anonymous fetch needs no credentials.
        run: |
          git submodule update --init --recursive
          git submodule update --remote rust-sql
          echo "Building against rust-sql master:"
          git -C rust-sql log --oneline -1

      - name: Install Rust toolchain (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Rustfmt (zero diff)
        # Scope: OUR workspace members only (backend + store_macros +
        # migrator). `--all` also walks PATH dependencies, which reaches
        # into the rust-sql submodule — vendored engine code with its own
        # fmt rules maintained in ITS repo. The submodule pin is not this
        # repo's style responsibility; a submodule bump must not fail on
        # formatting of files this repo cannot change.
        run: cargo fmt -p backend -p store_macros -p migrator -- --check

      - name: Check (rust-sql engine — the only backend, workspace-wide)
        run: cargo check --workspace --all-targets

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets
        env:
          # NOTE: must stay quoted — `sqlite::memory:` unquoted ends with a
          # colon, which is invalid YAML and silently kills the whole file.
          DATABASE_URL: "sqlite::memory:"
          JWT_SECRET: ci-test-secret-at-least-32-bytes-long-aaaaaaaa
          COOKIE_SECURE: "false"
          COOKIE_DOMAIN: localhost
          CACHE_BACKEND: moka
          WORKER_BACKEND: db
          SEARCH_INDEX_DIR: ""
          AUDIO_CALL_ENABLED: "false"
          NULLCLAW_ENABLED: "false"
          VNPAY_ENABLED: "false"
          MOMO_ENABLED: "false"
          ZALOPAY_ENABLED: "false"
          VIETQR_ENABLED: "false"
          OAUTH_GOOGLE_ENABLED: "false"
          OAUTH_FACEBOOK_ENABLED: "false"
          OAUTH_TWITTER_ENABLED: "false"

      - name: Doctests
        # `--all-targets` above does NOT compile doc tests — this does.
        run: cargo test --workspace --doc
        env:
          DATABASE_URL: "sqlite::memory:"
          JWT_SECRET: ci-test-secret-at-least-32-bytes-long-aaaaaaaa
          COOKIE_SECURE: "false"
          COOKIE_DOMAIN: localhost
          CACHE_BACKEND: moka
          WORKER_BACKEND: db
          SEARCH_INDEX_DIR: ""
          AUDIO_CALL_ENABLED: "false"
          NULLCLAW_ENABLED: "false"
          VNPAY_ENABLED: "false"
          MOMO_ENABLED: "false"
          ZALOPAY_ENABLED: "false"
          VIETQR_ENABLED: "false"
          OAUTH_GOOGLE_ENABLED: "false"
          OAUTH_FACEBOOK_ENABLED: "false"
          OAUTH_TWITTER_ENABLED: "false"

      - name: Rustdoc (zero warnings)
        # Broken intra-doc links rot silently without this gate.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - name: OpenAPI spec drift gate
        # The dump test above rewrites frontend/openapi.json from the
        # compiled-in utoipa spec. If the checked-in copy differs, the
        # backend API changed without regenerating the frontend contract.
        run: |
          if ! git diff --exit-code -- frontend/openapi.json; then
            echo "::error::frontend/openapi.json is STALE — the backend API surface changed without regenerating the spec."
            echo "Fix: cargo test --lib dump_openapi_spec_for_the_frontend_sdk"
            echo "     then: cd frontend && bun run openapi && commit BOTH."
            git --no-pager diff -- frontend/openapi.json | head -60
            exit 1
          fi
          echo "✅ frontend/openapi.json matches the backend API surface"

  backend-audit:
    name: Backend - Dependency audit (cargo-audit)
    needs: changes
    if: |
      needs.changes.outputs.run_all == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodule needed: the audit must resolve the patched
          # libsqlite3-sys path dependency.
          submodules: recursive

      - name: Pull latest rust-sql engine (master)
        # Same rationale as the backend job: audit the dependency tree we
        # would actually ship, including the newest engine's deps.
        run: |
          git submodule update --init --recursive
          git submodule update --remote rust-sql
          git -C rust-sql log --oneline -1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies for known CVEs
        run: cargo audit --deny warnings

  backend-quality:
    name: Backend - quality (deny / machete / taplo)
    needs: changes
    if: |
      needs.changes.outputs.run_all == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull latest rust-sql engine (master)
        run: |
          git submodule update --init --recursive
          git submodule update --remote rust-sql
          git -C rust-sql log --oneline -1

      - name: Install Rust toolchain (metadata resolution)
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned lint binaries
        # Pinned release downloads (not `latest`) — CI must be reproducible.
        # If a tool updates, bump the URL + version comment together.
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          cd /tmp
          # cargo-deny 0.20.2 (static musl)
          curl -fsSL --retry 3 https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar xz
          mv cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny ~/.local/bin/
          # cargo-machete 0.9.2 (static musl)
          curl -fsSL --retry 3 https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz | tar xz
          mv cargo-machete-v0.9.2-x86_64-unknown-linux-musl/cargo-machete ~/.local/bin/
          # taplo 0.10.0
          curl -fsSL --retry 3 https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz | gunzip > ~/.local/bin/taplo
          chmod +x ~/.local/bin/taplo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Dependency policy (cargo-deny)
        # deny.toml: advisories (vulns/unmaintained/unsound/yanked — with
        # a documented ignore list mirroring .cargo/audit.toml), license
        # allow-list (copyleft rejected), sources (crates.io + paths only).
        run: cargo deny --log-level error check advisories licenses sources

      - name: Unused dependencies (cargo-machete)
        # rust-sql is a submodule tracking upstream master — findings in
        # ITS crates belong upstream, so only OUR crates gate this step.
        # False-positive classes (link-only / re-export deps) are listed
        # per-crate under [package.metadata.cargo-machete] in the TOMLs.
        run: |
          set -euo pipefail
          findings=$(cargo-machete --skip-target-dir 2>/dev/null | awk '
            / -- \.\/rust-sql\// {skip=1; next}
            / -- \.\//          {skip=0}
            skip == 0 && /^\t/  {print}
          ' || true)
          if [ -n "$findings" ]; then
            echo "::error::Unused dependencies found in OUR crates:"
            echo "$findings"
            echo ""
            echo "Fix: remove them from Cargo.toml, or — if it is a"
            echo "false positive (link-only / re-exported dep) — document"
            echo "it under [package.metadata.cargo-machete] ignored."
            exit 1
          fi
          echo "✅ no unused dependencies in backend / migrator / store_macros"

      - name: TOML format (taplo)
        # taplo.toml scopes this to OUR manifests (rust-sql excluded) and
        # keeps hand-written array layouts untouched.
        run: taplo fmt --check

  frontend:
    name: Frontend (React/TS)
    needs: changes
    if: |
      needs.changes.outputs.run_all == 'true' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check (prettier)
        run: bun run format:check

      - name: Lint (eslint, whole tree, zero warnings)
        run: bun run lint

      - name: Type check (tsc — src, e2e specs, build configs)
        run: bunx tsc --noEmit

      - name: OpenAPI SDK freshness
        # Regenerates src/lib/api from the committed openapi.json and
        # fails if the checked-in SDK differs — catches "backend endpoint
        # shipped but frontend SDK never regenerated".
        run: |
          set -euo pipefail
          cp -r src/lib/api /tmp/sdk-before
          bun run openapi
          if ! diff -rq /tmp/sdk-before src/lib/api; then
            echo "::error::src/lib/api is STALE vs frontend/openapi.json."
            echo "Fix: cd frontend && bun run openapi, then commit the regenerated SDK."
            exit 1
          fi
          echo "✅ generated SDK matches openapi.json"

      - name: Dead code + unused deps (knip)
        # KNIP_DISABLE_RAW_TRANSFER: oxc raw transfer reserves a ~6 GiB
        # virtual ArrayBuffer — blows up on small runners; the standard
        # parser path is equivalent, marginally slower.
        run: bunx knip --include files,dependencies
        env:
          KNIP_DISABLE_RAW_TRANSFER: "1"

      - name: Test (vitest)
        run: bunx vitest run
        env:
          NODE_ENV: test

      - name: Build
        run: bun run build

  frontend-e2e:
    name: Frontend - E2E (Playwright)
    needs: changes
    if: |
      needs.changes.outputs.run_all == 'true' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install chromium + system deps
        run: bunx playwright install --with-deps chromium

      - name: Run e2e suite
        # playwright.config.ts starts the Vite dev server itself (port
        # 5183) and the specs make zero API calls — no backend needed.
        run: bunx playwright test
        env:
          CI: "true"

  mobile:
    name: Mobile (Flutter)
    needs: changes
    if: |
      needs.changes.outputs.run_all == 'true' ||
      needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Install Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          # Caches ~/.pub-cache keyed on pubspec.lock.
          cache: true

      - name: Format check (dart format)
        # The formatter IS the style guide — no config drift possible.
        # Normalize locally with: cd mobile && dart format .
        run: dart format --output=none --set-exit-if-changed .

      - name: Install dependencies
        run: flutter pub get

      # The gate the mobile workflow actually blocks on: zero analyzer
      # issues (infos included — lints keep the codebase honest).
      - name: Analyze (zero issues)
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # Full Gradle/AGP/Kotlin build — catches Android-side regressions
      # (plugin Gradle integration, manifest, res/raw resources) that
      # analyze/test cannot see.
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          # NOTE: cache `path` is relative to the repo root, NOT the job's
          # `defaults.run.working-directory`.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK (smoke)
        run: flutter build apk --debug

  repo-hygiene:
    name: Repo hygiene (shell / docker / markdown / json)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun (markdownlint-cli2 runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pinned lint binaries
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          cd /tmp
          # actionlint 1.7.12
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz actionlint
          mv actionlint ~/.local/bin/
          # ShellCheck (koalaman) v0.11.0
          curl -fsSL --retry 3 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar xJ --strip-components=1 shellcheck-v0.11.0/shellcheck
          mv shellcheck ~/.local/bin/
          # hadolint 2.15.1
          curl -fsSL --retry 3 https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64 -o ~/.local/bin/hadolint
          chmod +x ~/.local/bin/hadolint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Workflow lint (actionlint)
        # Catches expression/schema/shell-injection mistakes in the
        # workflow files themselves — before they fail at 2am.
        run: actionlint

      - name: Shell lint (shellcheck, warnings as errors)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r f; do
            if ! shellcheck -S warning "$f"; then
              echo "::error::shellcheck findings in $f"
              status=1
            fi
          done < <(git ls-files '*.sh')
          exit $status

      - name: Dockerfile lint (hadolint)
        run: hadolint Dockerfile

      - name: Markdown lint (markdownlint-cli2, repo-wide)
        run: |
          set -euo pipefail
          cd frontend
          bun install --frozen-lockfile
          cd ..
          frontend/node_modules/.bin/markdownlint-cli2

      - name: JSON validity (manifests + configs)
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "frontend/openapi.json",
              "frontend/public/manifest.webmanifest",
              "frontend/package.json",
              "frontend/tsconfig.json",
              "frontend/components.json",
              "frontend/.prettierrc",
              "nullclaw.config.json",
            ];
            // tsconfig.json is JSONC BY SPEC: TypeScript allows // and
            // /* */ comments + trailing commas. Strict JSON.parse would
            // reject legal configs (e.g. a trailing comma after the last
            // compilerOptions key), so those files get a JSONC-tolerant
            // parse — strip comments + trailing commas, then JSON.parse.
            // Semantics are gated by `tsc --noEmit` in the Frontend job.
            const jsonc = (s) => JSON.parse(
              s.replace(/\/\*[\s\S]*?\*\//g, "")   // /* block */ comments
               .replace(/^\s*\/\/.*$/gm, "")       // // line comments
               .replace(/,(\s*[\]}])/g, "$1")        // trailing commas
            );
            for (const f of files) {
              const text = fs.readFileSync(f, "utf8");
              (f.includes("tsconfig") ? jsonc(text) : JSON.parse(text));
              console.log("valid json" + (f.includes("tsconfig") ? "c" : "") + ": " + f);
            }
          '

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs full git history to scan all commits.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # `GITHUB_TOKEN` is provided by Actions; gitleaks uses it for
          # PR annotations. The action is free for OSS, paid for private
          # repos. For private repos, set `GITLEAKS_LICENSE` as a repo
          # secret — see https://github.com/gitleaks/gitleaks-action.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Defense-in-depth: even if gitleaks misses something (or the action
      # is disabled), grep for the leaked-secret patterns we already know
      # about. This is the regression test mentioned in SECURITY.md.
      - name: Reject known-leaked secret patterns in committed files
        run: |
          set -e
          # The leaked Google OAuth client secret from .env.example (now scrubbed).
          # NOTE: --exclude=ci.yml — the patterns themselves necessarily appear
          # in THIS file; without the exclusion the grep matches itself and the
          # step fails on every run (self-referential match, seen 2026-09-07).
          if grep -r --line-number --exclude=ci.yml "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" . --exclude-dir=.git; then
            echo "❌ FOUND: previously-leaked Google OAuth client secret"
            exit 1
          fi
          # The leaked JWT secret from .env.example (now scrubbed).
          if grep -r --line-number --exclude=ci.yml "8ec7dc585377c32aaa59104b093be930bb094ff4e6b32e580351e3d0d702a084" . --exclude-dir=.git; then
            echo "❌ FOUND: previously-leaked JWT secret"
            exit 1
          fi
          echo "✅ No known-leaked secrets in committed files"

  docker-build:
    name: Docker image build (smoke)
    needs: changes
    if: |
      needs.changes.outputs.run_all == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The engine submodule is part of the build context.
          submodules: recursive

      - name: Pull latest rust-sql engine (master)
        # The Docker build context is the WORKING TREE — updating the
        # submodule before `docker build` bakes the newest engine source
        # into the image, matching what deploy.yml ships.
        run: |
          git submodule update --init --recursive
          git submodule update --remote rust-sql
          git -C rust-sql log --oneline -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'frontend/bun.lock') }}
          restore-keys: docker-${{ runner.os }}-

      - name: Build backend image (rust-sql engine)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rust-be-template:ci
          cache-from: type=local,src=/tmp/.docker-cache
          cache-to: type=local,dest=/tmp/.docker-cache,mode=max
