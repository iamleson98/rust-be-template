# ─── CodeQL: semantic security analysis ──────────────────────────────
#
# Complements the CI lint/format/test harness (ci.yml) with deep
# semantic analysis of the Rust backend and the TypeScript frontend:
# injection, path traversal, crypto misuse, SSRF, unsafe-adjacent
# patterns, etc. Not a style gate — a vulnerability discovery gate.
#
# Triggers: every push/PR on the tracked branches + a weekly schedule
# (new query packs and newly-disclosed patterns get a chance to flag
# unchanged code).
#
# NOTE on `rust`: CodeQL traces a real `cargo build` — the submodule
# must be checked out AND updated to upstream master, same as the
# backend CI job, and libssl/pkg-config must be present.

name: CodeQL

on:
  push:
    branches: [master, server, main]
  pull_request:
    branches: [master, server, main]
  schedule:
    # Mondays 04:30 UTC — off-peak, catches new queries on old code.
    - cron: '30 4 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Required to upload SARIF results.
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull latest rust-sql engine (master)
        if: matrix.language == 'rust'
        run: |
          git submodule update --init --recursive
          git submodule update --remote rust-sql
          git -C rust-sql log --oneline -1

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        if: matrix.language == 'rust'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Default suite = security + quality queries for the language.
          queries: security-extended

      - name: Build (Rust compilation tracing)
        # CodeQL for Rust has no autobuild — it instruments a real build.
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          cargo build --workspace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
