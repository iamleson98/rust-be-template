# ─── CodeQL: semantic security analysis ──────────────────────────────
#
# Semantic security analysis of the TypeScript code (cloudflare/): injection,
# path traversal, crypto misuse, SSRF, unsafe patterns. Not a style gate — a
# vulnerability discovery gate.
#
# TRIGGERS:
#   * pull_request — analyzes the MERGE REF, so the exact tree a merge would
#     produce is what gets analyzed; results annotate the PR.
#   * schedule (Mon 04:30 UTC) — refreshes the default-branch analysis on the
#     Security tab. GitHub auto-disables scheduled workflows after 60 days
#     with no repository activity; any push re-enables them.

name: CodeQL

on:
  pull_request:
    branches: [master, feat/cloudflare-migration]
  merge_group:
    types: [checks_requested]
    branches: [master, feat/cloudflare-migration]
  schedule:
    # Mondays 04:30 UTC — off-peak, catches new queries on old code.
    - cron: '30 4 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Required to upload SARIF results.
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Default suite = security + quality queries for the language.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
