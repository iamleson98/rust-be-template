# Standalone on purpose: it reuses the backend's OSM reader / admin-hierarchy
# code by path, but must NOT depend on the backend crate (that pulls in the
# rust-sql submodule and the whole server). The weekly place-index CI job
# builds only this crate.
[package]
name = "place-extract"
version = "0.1.0"
edition = "2021"
publish = false
description = "OSM PBF -> travel-relevant places (NDJSON) for the static place-search index"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
deunicode = "1"
geo = "0.29"
once_cell = "1"
osmpbf = "0.3"
regex = "1"
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
