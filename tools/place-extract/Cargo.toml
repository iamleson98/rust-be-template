# Standalone crate: the weekly place-index CI job (.github/workflows/place-index.yml)
# builds it to turn the Geofabrik Vietnam extract into the static place index
# that cloudflare/ serves.
[package]
name = "place-extract"
version = "0.1.0"
edition = "2021"
publish = false
description = "OSM PBF -> travel-relevant places (NDJSON) for the static place-search index"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
deunicode = "1"
geo = "0.29"
once_cell = "1"
osmpbf = "0.3"
regex = "1"
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
