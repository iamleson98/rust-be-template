# ┌──────────────────────────────────────────────────────────────────────┐
# │ Production docker-compose. Run on the VM after `terraform apply` +   │
# │ `terraform/deploy.sh`. This file replaces the previously commented-   │
# │ out example with a hardened, runnable config:                         │
# │  - no host port exposure for db / redis (only the app is exposed)     │
# │  - `security_opt: no-new-privileges` on every service                  │
# │  - `cap_drop: ALL` on every service                                    │
# │  - resource limits to prevent OOM cascade                              │
# │  - log caps to prevent disk fill                                       │
# │  - healthchecks with proper start_period                              │
# │  - `stop_grace_period: 30s` for graceful in-flight request drain     │
# │  - shared network for inter-service isolation                          │
# └──────────────────────────────────────────────────────────────────────┘

services:
  # ── Backend (Rust HTTP server) ─────────────────────────────────────────
  backend:
    image: ghcr.io/iamleson98/vexevn:latest
    build:
      context: .
      args:
        BACKEND_FEATURES: postgres
    ports:
      # Bind ONLY to 127.0.0.1 so Caddy (or your TLS-terminating reverse
      # proxy) is the only public ingress. If you don't use Caddy, set
      # this to "0.0.0.0:8080:8080" and ensure your firewall allows 80+443.
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # Override the dev SQLite default with the Postgres service below.
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-app}
      # Force HTTPS-only cookies in production.
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
      # Use the shared Redis for cache + WS hub backplane + worker.
      CACHE_BACKEND: "redis"
      CACHE_REDIS_URL: "redis://redis:6379/0"
      WORKER_BACKEND: "redis"
      WORKER_KAFKA_BROKERS: ""
    volumes:
      - app-storage:/app/storage
      - app-osm:/app/osm-index
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/backend", "db-backend"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    stop_grace_period: 30s
    stop_signal: SIGTERM
    networks:
      - vexevn-net

  # ── Postgres ──────────────────────────────────────────────────────────
  # Build the backend with `--features postgres` to use this.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pg-data:/var/lib/postgresql/data
    # ⚠️  No `ports:` mapping — the DB is reachable only on the internal
    # Docker network, never from the host or the public internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - vexevn-net

  # ── Redis (shared cache + WS hub backplane + worker broker) ───────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # ⚠️  No `ports:` mapping — same as `db`. Redis must be reachable
    # only on the internal Docker network.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - vexevn-net

  # ── NullClaw AI (chat support assistant) ──────────────────────────────
  nullclaw:
    image: ghcr.io/nullclaw-labs/nullclaw:latest
    restart: unless-stopped
    # Bind only to 127.0.0.1 — never expose this directly to the internet.
    # The backend talks to it over the internal Docker network.
    ports:
      - "127.0.0.1:42617:42617"
    environment:
      NULLCLAW_API_KEY: "${NULLCLAW_API_KEY:?set NULLCLAW_API_KEY in .env}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      OPENAI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
      OPENAI_API_KEY: "${GEMINI_API_KEY:-}"
      NULLCLAW_MODEL: "${NULLCLAW_MODEL:-gemini-2.0-flash}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - vexevn-net

networks:
  vexevn-net:
    driver: bridge
    # Default bridge network is fine for single-host. For multi-host,
    # use `driver: overlay` with Docker Swarm.

volumes:
  app-storage:
  app-osm:
  pg-data:
  redis-data:
