# ┌──────────────────────────────────────────────────────────────────────┐
# │ Production docker-compose for Docker Swarm.                          │
# │                                                                      │
# │ Deploy:                                                              │
# │   docker swarm init --advertise-addr <VM_PRIVATE_IP>                │
# │   docker stack deploy -c docker-compose.prod.yml --with-registry-auth vexevn │
# │                                                                      │
# │ Hardened:                                                            │
# │  - no host port exposure for db / redis (only Caddy is public)      │
# │  - `security_opt: no-new-privileges` on every service                │
# │  - `cap_drop: ALL` on every service                                  │
# │  - resource limits to prevent OOM cascade                            │
# │  - log caps to prevent disk fill                                     │
# │  - healthchecks with proper start_period                             │
# │  - `stop_grace_period: 30s` for graceful in-flight request drain   │
# │  - `deploy.restart_policy` for Swarm-native restarts                 │
# │  - `deploy.update_config` for zero-downtime rolling updates          │
# │                                                                      │
# │ NOTE: Docker Swarm ignores `depends_on`, `restart:`, and `build:`.   │
# │ This file uses Swarm-native `deploy:` sections for restart policy   │
# │ and update behavior. The backend retries DB connection internally   │
# │ on startup (with restart_policy: on-failure for safety).             │
# └──────────────────────────────────────────────────────────────────────┘

services:
  # ── Backend (Rust HTTP server) ─────────────────────────────────────────
  backend:
    image: ghcr.io/iamleson98/vexevn:latest
    ports:
      # Bind ONLY to 127.0.0.1 so Caddy (running as a Swarm service below)
      # is the only public ingress. If you don't use Caddy, change to
      # "0.0.0.0:8080:8080" and ensure your firewall allows 80+443.
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # Override the dev SQLite default with the Postgres service below.
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-app}
      # Force HTTPS-only cookies in production.
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
      # Use the shared Redis for cache + WS hub backplane + worker.
      CACHE_BACKEND: "redis"
      CACHE_REDIS_URL: "redis://redis:6379/0"
      WORKER_BACKEND: "redis"
      WORKER_REDIS_URL: "redis://redis:6379/1"
      WORKER_KAFKA_BROKERS: ""
      # Fail fast if JWT_SECRET is missing.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # NullClaw AI — built directly into the backend (no external container).
      # Uses the LLM API directly via OpenAI-compatible endpoint.
      NULLCLAW_ENABLED: ${NULLCLAW_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash}
    volumes:
      - app-storage:/app/storage
      - app-osm:/app/osm-index
    healthcheck:
      # Hit the actual HTTP health endpoint — the previous command
      # (`/app/backend db-backend`) just printed the DB name + exited 0,
      # which always reported "healthy" even when the server was dead.
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 10
        delay: 10s
        window: 30s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    stop_grace_period: 30s
    stop_signal: SIGTERM
    networks:
      - vexevn-net

  # ── Postgres ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pg-data:/var/lib/postgresql/data
    # ⚠️  No `ports:` mapping — the DB is reachable only on the internal
    # Docker network, never from the host or the public internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s
        window: 30s
      resources:
        limits:
          memory: 1g
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - vexevn-net

  # ── Redis (shared cache + WS hub backplane + worker broker) ───────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # ⚠️  No `ports:` mapping — same as `db`.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s
        window: 30s
      resources:
        limits:
          memory: 512m
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - vexevn-net

  # ── Caddy (TLS-terminating reverse proxy) ─────────────────────────────
  # Handles automatic Let's Encrypt HTTPS + reverse proxy to the backend.
  # Caddy automatically handles WebSocket upgrades (no special config needed).
  # Replace `yourdomain.com` in the Caddyfile before deploying.
  #
  # NOTE: NullClaw AI is now built directly into the backend — no separate
  # container needed. Set NULLCLAW_ENABLED=true + LLM_API_KEY in .env to
  # enable AI chat replies. See DEPLOYMENT.md §6 for details.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s
        window: 30s
      resources:
        limits:
          memory: 256m
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - vexevn-net

networks:
  vexevn-net:
    # `bridge` works for single-host Swarm. For multi-host, use:
    #   driver: overlay
    #   attachable: true
    driver: bridge

volumes:
  app-storage:
  app-osm:
  pg-data:
  redis-data:
  caddy_data:
  caddy_config:
