[package]
name = "backend"
version = "0.1.0"
edition = "2021"
description = "12-factor Rust backend: layered store + RBAC + JWT + WS + worker"
license = "MIT"

[[bin]]
name = "backend"
path = "src/main.rs"

[workspace]
members = ["store_macros", "migrator"]
exclude = ["rust-sql"]

# ── Database engine: rustqlite (submodule rust-sql) — the ONLY one ──
#
# sea-orm speaks its sqlite dialect through sqlx-sqlite, and every
# sqlite3_* FFI call lands in the PURE-RUST rustqlite engine:
# `libsqlite3-sys` is patched to rustqlite's drop-in replacement AND
# `rustqlite-compat` (the sqlite3_* C ABI implemented on the rustqlite
# engine) is linked as a Rust rlib compiled into the binary. There is
# no C SQLite, no libsqlite3.so, and no postgres backend — the engine
# is not a cargo feature anymore; EVERY build links rust-sql.
#
# The link mode is selected by RUSTQLITE_LINK_MODE=rlib in
# .cargo/config.toml (see that file for the full rationale); the whole
# engine builds from source with the app — no prebuilt artifacts, no
# rpath, no system-libsqlite3 fallback.
#
# The submodule pin lives in .gitmodules + the gitlink; `git submodule
# update --init --recursive` after clone. CI/Docker check it out with
# submodules: recursive.
#
# NOTE: the engine enables mimalloc as the global allocator (its
# default feature). This is deliberate — it also accelerates the rest
# of the process — but it means the binary links mimalloc.
[patch.crates-io]
libsqlite3-sys = { path = "rust-sql/compat/libsqlite3-sys" }

[dependencies]
store_macros = { path = "store_macros" }
migrator = { path = "migrator" }
# The engine itself: exports the sqlite3_* symbols sqlx-sqlite calls.
# (rlib link mode — see .cargo/config.toml.) Unconditional: rust-sql
# is the only database engine in this project.
rustqlite-compat = { path = "rust-sql/compat/rustqlite-compat" }
# Direct FFI to the ONE mimalloc instance the engine links as the
# global allocator (rustqlite default feature). Version + features
# mirror rust-sql's own pin so cargo resolves both to a single copy.
# Used by `memory::collect()` — the engine sets purge_delay=-1 (never
# auto-return freed pages) and only drains at its own write-burst
# boundaries; the SERVICE's transient peaks (axum/serde/tantivy/moka
# churn) need the periodic mi_collect in src/memory.rs or RSS sticks
# at the historical watermark forever.
libmimalloc-sys = { version = "0.1", features = ["extended"] }

# Async runtime — explicit features instead of "full" to keep compile + binary lean.
# Add "process" only if you need to spawn child processes (currently not used).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "fs"] }
futures = "0.3"
async-trait = "0.1"

# Web framework
# "multipart" powers the admin picture-upload endpoint (route media).
axum = { version = "0.8", features = ["ws", "macros", "tokio", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "cors", "fs", "trace", "set-header", "limit"] }
tower_governor = "0.7"

# Database — sea-orm on the rust-sql (rustqlite) engine, always.
# sqlx-sqlite is the dialect driver; its FFI is satisfied by the
# patched libsqlite3-sys + rustqlite-compat (see the engine block
# above). There is no backend selection at build or runtime time.
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sea-query = "0.32"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
constant_time_eq = "0.3"

# Cache
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }

# Object storage
aws-config = { version = "1", features = ["behavior-version-latest"] }
# default-features = false: the SDK default enables BOTH the modern
# default-https-client (hyper 1 / rustls 0.23 / h2 0.4) AND the legacy
# `rustls` feature (hyper 0.14 / rustls 0.21 / h2 0.3 / rustls-webpki
# 0.101) — the legacy half carries open CVEs (RUSTSEC-2026-0258 h2,
# RUSTSEC-2026-0098/-0099/-0104 webpki) with no patches in those old
# lines. We keep everything from the default EXCEPT the legacy half.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "default-https-client",
    "sigv4a",
    "http-1x",
] }
bytes = "1"
mime = "0.3"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }

# Worker — rdkafka is optional because librdkafka requires system libs.
# Enable via `--features kafka` when you actually need the Kafka broker.
rdkafka = { version = "0.36", features = ["tokio"], default-features = false, optional = true }

# HTTP client (for Valhalla routing proxy)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# Search / OSM place index (Tantivy fulltext + geo + OSM PBF ingestion)
tantivy = "0.22"
osmpbf = "0.3"
geo = "0.29"
rstar = "0.12"
deunicode = "1"
regex = "1"
num_cpus = "1"

# High-concurrency maps for WS hubs
dashmap = "6"

# System monitoring — cross-platform CPU + memory stats for the
# /api/admin/system endpoint. Works on Linux, macOS, + Windows.
sysinfo = "0.32"

# Payment provider integration
# - `qrcode` generates PNG bytes for VietQR / provider-QR rendering
#   (used in-memory, no file system access).
# - `image` provides the `Luma<u8>` pixel type used by `qrcode::render`.
#   Only the `png` encoder is enabled — keeps the dependency surface
#   minimal.
# - `crc` computes the CRC-16/CCITT required at the end of every EMV
#   QR payload (VietQR / NAPAS MPC QR Code standard).
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
crc = "3"

# Vietnamese text helpers
unidecode = "0.3"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config + errors
dotenvy = "0.15"
figment = { version = "0.10", features = ["env", "toml"] }
thiserror = "2"
anyhow = "1"
once_cell = "1"
validator = { version = "0.20", features = ["derive"] }
url = "2"
urlencoding = "2"
parking_lot = "0.12"
hex = "0.4"
time = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3.27.0"

[features]
default = []

# The database engine is NOT a feature flag anymore — every build links
# the rust-sql (rustqlite) engine via the sqlx-sqlite C-ABI compat
# layer (see the engine block at the top of this file). The former
# `sqlite` / `postgres` backend features were removed 2026-09.

# Worker — Kafka broker is optional because librdkafka requires system libs.
kafka = ["rdkafka"]

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# Direct C-ABI access for the engine regression test
# (tests/engine_regression.rs) — drives the rustqlite engine exactly
# the way sqlx-sqlite does.
libsqlite3-sys = { path = "rust-sql/compat/libsqlite3-sys" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Line tables only (no full DWARF vars): `thread apply all bt` under gdb
# shows real frame names + file:line for every tokio worker — the freeze
# watchdog captures them when /health hangs (see deploy/freeze-watchdog).
# This is what made the 2026-09 runtime-freeze post-mortem possible;
# `strip = true` turned every backtrace into bare addresses.
debug = "line-tables-only"
