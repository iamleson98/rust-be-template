[package]
name = "backend"
version = "0.1.0"
edition = "2021"
description = "12-factor Rust backend: layered store + RBAC + JWT + WS + worker"
license = "MIT"

[[bin]]
name = "backend"
path = "src/main.rs"

[workspace]
members = ["store_macros", "migrator", "tools/place-extract"]

# ── Database engine: real C SQLite (begin-concurrent-3.51 branch) ──
#
# sea-orm speaks its sqlite dialect through sqlx-sqlite, and sqlx's
# `sqlite` feature compiles the bundled SQLite amalgamation from
# `libsqlite3-sys`. That crate is patched to the in-repo copy under
# vendor/libsqlite3-sys, whose amalgamation is built from SQLite's
# `begin-concurrent-3.51` branch (it adds `BEGIN CONCURRENT`, the page-level
# optimistic write concurrency the write path relies on; plain WAL
# mode, no wal2). `vendor/libsqlite3-sys/PINNED` records the exact
# commit; regenerate it with `scripts/sqlite-amalgamate.sh <sha>`.
# The compile flags live in vendor/libsqlite3-sys/build.rs.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

[dependencies]
store_macros = { path = "store_macros" }
migrator = { path = "migrator" }
# Direct FFI to the bundled SQLite's identity functions (`db::sqlite_version`
# / `db::sqlite_source_id`). No features: sqlx-sqlite selects them, and
# `[patch.crates-io]` above swaps in the vendored copy.
libsqlite3-sys = { version = "0.30", default-features = false }
# mimalloc is the process-wide #[global_allocator] (src/main.rs).
# `libmimalloc-sys` is the same library, used directly for
# `memory::collect()` (periodic mi_collect, see src/memory.rs); the
# `extended` feature exposes mi_collect.
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }

# Async runtime — explicit features instead of "full" to keep compile + binary lean.
# Add "process" only if you need to spawn child processes (currently not used).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "fs"] }
futures = "0.3"
async-trait = "0.1"

# Web framework
# "multipart" powers the admin picture-upload endpoint (route media).
axum = { version = "0.8", features = ["ws", "macros", "tokio", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "cors", "fs", "trace", "set-header", "limit"] }

# Database — sea-orm on real C SQLite, always. sqlx-sqlite is the
# dialect driver; its FFI is satisfied by the patched libsqlite3-sys
# (see the engine block above). There is no backend selection at
# build or runtime.
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sea-query = "0.32"
# Binds sea-query values to sqlx statements for `db::write::ConcurrentTx`
# (the same binder sea-orm uses internally; features match sea-orm's).
sea-query-binder = { version = "0.7", default-features = false, features = ["sqlx-sqlite", "with-chrono", "with-uuid", "with-json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"

# Auth
# jsonwebtoken 10 made the crypto provider opt-in: default features
# carry NO provider (`default = ["use_pem"]`), and without exactly one
# of `rust_crypto` / `aws_lc_rs` (or an explicit
# `CryptoProvider::install_default()`) every encode/decode PANICS at
# runtime — login/refresh died with 502s after the 9.3.1 → 10.3.0
# dependabot bump (2026-09-20 outage). `rust_crypto` is the pure-Rust
# provider (hmac/sha2/rsa/…): no cmake/nasm build deps, CI-friendly.
# JwtManager::new() also installs it explicitly as belt-and-braces
# against future feature unification flipping auto-detection.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
# Verifies the `pbkdf2$<iter>$<salt>$<hash>` hashes imported from the
# Worker's D1 (they are rehashed to Argon2 on the next login).
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
# TURN REST auth (draft-uberti-behave-turn-rest): per-user time-limited
# relay credentials = base64(HMAC-SHA1(shared_secret, "expiry:userId")).
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"
constant_time_eq = "0.3"
# SEC-2026-WH: Ed25519 verification of Discord interaction webhooks.
ed25519-dalek = "2"

# Cache
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }

# Object storage
aws-config = { version = "1", features = ["behavior-version-latest"] }
# default-features = false: the SDK default enables BOTH the modern
# default-https-client (hyper 1 / rustls 0.23 / h2 0.4) AND the legacy
# `rustls` feature (hyper 0.14 / rustls 0.21 / h2 0.3 / rustls-webpki
# 0.101) — the legacy half carries open CVEs (RUSTSEC-2026-0258 h2,
# RUSTSEC-2026-0098/-0099/-0104 webpki) with no patches in those old
# lines. We keep everything from the default EXCEPT the legacy half.
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "default-https-client",
  "sigv4a",
  "http-1x",
] }
bytes = "1"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client (for Valhalla routing proxy)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "http2"], default-features = false }

# In-process place engine (fst term index, atomically swapped generations);
# `place-extract` supplies the place records and the OSM extractor.
place-extract = { path = "tools/place-extract" }
fst = { version = "0.4", features = ["levenshtein"] }
unicode-normalization = "0.1"
md-5 = "0.10"
indexmap = "2"
arc-swap = "1"
num_cpus = "1"

# High-concurrency maps for WS hubs
dashmap = "6"

# System monitoring — cross-platform CPU + memory stats for the
# /api/admin/system endpoint. Works on Linux, macOS, + Windows.
sysinfo = "0.32"

# Payment provider integration
# - `qrcode` generates PNG bytes for VietQR / provider-QR rendering and the
#   SVG boarding QR on tickets
#   (used in-memory, no file system access).
# - `image` provides the `Luma<u8>` pixel type used by `qrcode::render`.
#   Only the `png` encoder is enabled — keeps the dependency surface
#   minimal. (The EMV QR CRC-16/CCITT checksum is implemented by hand
#   in src/payment/vietqr.rs — no `crc` crate needed.)
qrcode = { version = "0.14", default-features = false, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Lossy WebP encoder (bundled libwebp, built with `cc` like the vendored
# SQLite). `image`'s own WebP encoder is lossless-only and produces huge
# files; no `img` feature: callers hand it raw RGB/RGBA buffers.
webp = { version = "0.3", default-features = false }

# Vietnamese text helpers — none anymore: `unidecode` was removed
# 2026-10 (zero usages; the OSM normalizer uses `deunicode` above).

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config + errors
# (figment was removed 2026-10: zero usages — config is env + dotenvy only.)
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
once_cell = "1"
validator = { version = "0.20", features = ["derive"] }
url = "2"
urlencoding = "2"
parking_lot = "0.12"
hex = "0.4"
time = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

[features]
default = []

# The database engine is NOT a feature flag — every build links the
# vendored SQLite (see the engine block at the top of this file).

# ── cargo-machete (unused-dependency detector) false positive ──
#
# `md-5` — the package is named `md-5` but its library is `md5`
# (`use md5::…` in src/places/build.rs), which machete cannot map back.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[dev-dependencies]
tempfile = "3.27.0"
tokio-test = "0.4"
# WebSocket client for socket-level tests (same version axum links).
tokio-tungstenite = "0.29"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Line tables only (no full DWARF vars): `thread apply all bt` under gdb
# shows real frame names + file:line for every tokio worker — the freeze
# watchdog captures them when /health hangs (see deploy/freeze-watchdog).
# This is what made the 2026-09 runtime-freeze post-mortem possible;
# `strip = true` turned every backtrace into bare addresses.
debug = "line-tables-only"
