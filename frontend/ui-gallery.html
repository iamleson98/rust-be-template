<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DatXeVui — UI Component Gallery (dev-only)</title>
    <style>
      /* Same self-hosted Geist font stack the production index.html uses,
         so the gallery renders with the real app typography. */
      @font-face {
        font-family: 'Geist Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url(/fonts/geist-vietnamese-wght-normal.woff2) format('woff2-variations');
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
          U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'Geist Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url(/fonts/geist-latin-ext-wght-normal.woff2) format('woff2-variations');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Geist Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url(/fonts/geist-latin-wght-normal.woff2) format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Pre-hydration body background to avoid a white flash before
         styles.css is applied by Vite. Matches the app's light theme. */
      body {
        margin: 0;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui-gallery/main.tsx"></script>
  </body>
</html>
