<!doctype html>
<html lang="vi" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DatXeVui" />
    <meta name="application-name" content="DatXeVui" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="mask-icon" href="/logo-mask.svg" color="#147cd3" />

    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />

    <!-- The backend replaces this per request with the page's own head:
         title, description, canonical, robots, Open Graph, Twitter card,
         structured data (and the hero preload on the home page). -->
    <!--app-head-->

    <!-- ── Google tags — injected by prerender.mjs at build time ────
         Placeholders replaced when `bun run build` runs:
           %VITE_GSC_VERIFICATION_META%  ← VITE_GSC_VERIFICATION env var
                                            (Search Console ownership)
           %GOOGLE_TAGS%                 ← gtag.js + GA4 / Google Ads
                                            config + Ads conversion labels
                                            (VITE_GA4_ID, VITE_GOOGLE_ADS_ID,
                                            VITE_GOOGLE_ADS_CONVERSIONS)
         Unset vars collapse to nothing — see docs/GOOGLE_ADS.md.
    -->
    <!-- %VITE_GSC_VERIFICATION_META% -->
    <!-- %GOOGLE_TAGS% -->

    <link rel="stylesheet" href="/fonts/geist.css" />

    <style>
      :root {
        --font-geist-sans: 'Geist Variable', ui-sans-serif, system-ui, -apple-system, sans-serif;
        --font-geist-mono: 'Geist Mono', ui-monospace, SFMono-Regular, monospace;
      }
      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        overscroll-behavior-y: none;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      button,
      a,
      [role='button'],
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
      button,
      [role='button'] {
        -webkit-touch-callout: none;
        user-select: none;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body class="antialiased bg-background text-foreground">
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-9999 focus:px-3 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded-md"
    >
      Bỏ qua tới nội dung chính
    </a>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
