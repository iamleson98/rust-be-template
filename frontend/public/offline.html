<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Không có kết nối — DatXeVui</title>
  <meta name="theme-color" content="#1d4ed8" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }
    .card { max-width: 28rem; text-align: center; padding: 2.5rem 1.5rem; }
    .icon {
      width: 4.5rem; height: 4.5rem; margin: 0 auto 1.5rem;
      background: rgba(59, 130, 246, 0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 2.25rem; height: 2.25rem; stroke: #60a5fa; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.5rem; color: #f8fafc; }
    p { font-size: 0.95rem; line-height: 1.5; margin: 0 0 1.5rem; color: #94a3b8; }
    button {
      background: #2563eb; color: #fff; border: none;
      padding: 0.75rem 1.5rem; border-radius: 0.5rem;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s; min-height: 44px; min-width: 44px;
    }
    button:hover { background: #1d4ed8; }
    button:active { background: #1e40af; }
    .hint { margin-top: 1.5rem; font-size: 0.8rem; color: #64748b; }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18" />
        <path d="m7 14 4-4 4 4 4-4" stroke-dasharray="0.5 3" />
      </svg>
    </div>
    <h1>Không có kết nối mạng</h1>
    <p>
      Bạn đang ngoại tuyến. Vui lòng kiểm tra kết nối Wi-Fi hoặc dữ liệu di động
      và thử lại. Các vé đã đặt vẫn có thể xem được khi mạng quay lại.
    </p>
    <button type="button" onclick="window.location.reload()">Thử lại</button>
    <p class="hint">DatXeVui sẽ tự động kết nối lại khi có mạng.</p>
  </main>
  <script>
    // When the browser regains connectivity, auto-reload the page so
    // the user is dropped back into the SPA without manual action.
    window.addEventListener('online', () => { window.location.reload() });
  </script>
</body>

</html>
