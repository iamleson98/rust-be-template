name: vexevn_support
description: >-
  VeXeVN support agent console — realtime customer chat and calls.
  Talks to the rust-be-template backend (/ws chat hub, /ws-call WebRTC
  signaling relay, /api/chat/* REST).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0-0'

dependencies:
  flutter:
    sdk: flutter

  # UI component library (shadcn-inspired) + its icon set.
  forui: ^0.26.0
  forui_lucide: ^0.26.0
  # Forui builds on the new Material library; the app uses the same one so
  # ThemeData/ThemeMode types stay a single family (no flutter/material ↔
  # material_ui clashes).
  material_ui: ^1.0.0

  # State management.
  flutter_riverpod: ^3.0.0

  # Navigation.
  go_router: ^18.0.0

  # Networking.
  dio: ^5.11.0
  web_socket_channel: ^3.0.0

  # Calls (audio over WebRTC; signaling via /ws-call).
  flutter_webrtc: ^1.6.0

  # Persistence.
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.0

  # Local notifications (new-message / new-request / incoming-call alerts).
  flutter_local_notifications: ^22.0.0

  # In-app messenger sounds — notification cues + looping call ringtone.
  # Real tunes, Apache-2.0: Google AOSP sound set + Jitsi Meet (see
  # assets/sounds/ATTRIBUTION.md).
  audioplayers: ^6.4.0

  # Haptics for incoming calls/messages (messenger-style).
  vibration: ^3.1.3

  # Utilities.
  intl: ^0.20.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
