# 3G heap: builds fine on 7-8 GB machines (CI runners) — the Flutter
# template's default 8G/4G metaspace crashes daemons on smaller hosts.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
