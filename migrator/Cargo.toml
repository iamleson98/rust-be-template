[package]
name = "migrator"
version = "0.1.0"
edition = "2021"
description = "Standalone database migration CLI — independent of the main backend"
license = "MIT"

[[bin]]
name = "migrator"
path = "src/main.rs"

[lib]
name = "migrator"
path = "src/lib.rs"

[features]
# The engine is not selectable: the migrator always runs on the
# vendored SQLite (the libsqlite3-sys patch lives in the workspace
# root).
default = []

[dependencies]
# Database
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }

# Entity generation (in-process). We run the same discovery + codegen
# sea-orm-cli uses (sea-schema 0.16 + sea-orm-codegen 1.1) inside this
# crate, so it shares the workspace SQLite build instead of needing a
# separately installed sea-orm-cli.
sea-schema = { version = "0.16.2", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "discovery", "writer", "probe"] }
sea-orm-codegen = { version = "=1.1.20", default-features = false }
sea-query = "0.32"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization / config
dotenvy = "0.15"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

# Observability — `tracing` (the facade macros) was removed 2026-10:
# zero usages; tracing-subscriber is initialized directly in main.rs.
# (`url` was removed the same day — DATABASE_URL parsing uses plain
# String + starts_with, not the url crate.)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
