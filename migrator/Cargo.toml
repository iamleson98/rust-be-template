[package]
name = "migrator"
version = "0.1.0"
edition = "2021"
description = "Standalone database migration CLI — independent of the main backend"

[[bin]]
name = "migrator"
path = "src/main.rs"

[lib]
name = "migrator"
path = "src/lib.rs"

[features]
# The engine is not selectable: the migrator always runs on the
# rust-sql (rustqlite) engine — sea-orm's sqlite dialect via the
# sqlx-sqlite C-ABI compat layer (the libsqlite3-sys patch lives in
# the workspace root). The former sqlite/postgres backend features
# were removed 2026-09.
default = []

[dependencies]
# Database
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }

# Entity generation (in-process, via the rust-sql engine).
# sea-orm-cli CANNOT be used here: it is a standalone binary whose own
# sqlx-sqlite driver links REAL SQLite, so it cannot read the rust-sql
# on-disk format ("file is not a database"). Instead we run the same
# discovery + codegen sea-orm-cli uses (sea-schema 0.16 + sea-orm-codegen
# 1.1) inside this crate, where the workspace [patch] routes every
# sqlite3_* FFI call to the rustqlite engine.
sea-schema = { version = "0.16.2", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "discovery", "writer", "probe"] }
sea-orm-codegen = { version = "=1.1.20", default-features = false }
sea-query = "0.32"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
# The rust-sql engine itself (rlib link mode): the migrator binary
# links sqlx-sqlite, whose sqlite3_* FFI is satisfied by the compat
# crate's #[no_mangle] exports. The link anchor in src/lib.rs keeps
# this rlib on the migrator binary's link line (see the engine block
# in the workspace root Cargo.toml).
rustqlite-compat = { path = "../rust-sql/compat/rustqlite-compat" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization / config
dotenvy = "0.15"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
url = "2"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
