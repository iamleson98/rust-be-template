# Docker Swarm stack for VeXeVN (datxevui.com) — deployed on the shared
# single-manager node that already runs the pdf-tts stack + shared Caddy.
#
# Deployed by .github/workflows/deploy.yml (tag push → GHCR image → SSH):
#   cd /opt/vexevn && IMAGE=ghcr.io/iamleson98/rust-be-template:v0.1.0 bash deploy.sh
#
# The backend joins the EXISTING `pdf-tts_pdf-tts` attachable overlay
# network so the already-running Caddy (service pdf-tts_caddy, which owns
# host ports 80/443) can reach it at `datxevui_backend:8080` and proxy
# datxevui.com → here. This stack publishes NO ports itself.
#
# NOTE: `docker stack deploy` does NOT support `env_file:` — values are
# interpolated from the (exported) shell environment; deploy.sh sources
# /opt/vexevn/.env first. Secrets (JWT) are generated on the server.

services:
  backend:
    image: ${IMAGE:?IMAGE is required}
    environment:
      # ── Server ─────────────────────────────────────────────────
      - SERVER_HOST=0.0.0.0
      - RUST_LOG=${RUST_LOG:-info,backend=info,tower_http=warn}

      # ── Route media (RustFS object storage) ─────────────────────
      # Pictures for routes: uploaded/validated/thumbnail'd by the
      # backend, served straight from the CDN origin (media host →
      # Caddy → rustfs) in production. Until STORAGE_PUBLIC_BASE_URL
      # is set (DNS + CDN for the media host), the backend falls back
      # to proxying bytes itself at /api/media/{key}.
      - STORAGE_BACKEND=${STORAGE_BACKEND:-rustfs}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-datxevui-media}
      - STORAGE_S3_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required in .env}
      - STORAGE_S3_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required in .env}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-http://rustfs:9000}
      - STORAGE_S3_FORCE_PATH_STYLE=true
      - STORAGE_PUBLIC_BASE_URL=${STORAGE_PUBLIC_BASE_URL:-}

      # ── Database (rust-sql engine file on the data volume) ──────
      - DATABASE_URL=${DATABASE_URL:-sqlite:/app/data/app.db?mode=rwc}

      # ── JWT (generated on first run, see deploy.sh) ────────────
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in .env}

      # ── Cookies: same-origin SPA over HTTPS (Caddy terminates
      #    Let's Encrypt TLS) ──────────────────────────────────────
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}

      # ── CORS: same-origin (frontend + API behind one host) ──────
      - CORS_ORIGINS=${CORS_ORIGINS:-https://datxevui.com,https://www.datxevui.com}

      # ── Rate limit ──────────────────────────────────────────────
      # IMPORTANT: all traffic arrives via the Caddy container, so the
      # backend sees ONE socket peer IP for everyone. Keep the global
      # bucket generous; do per-client limiting at the edge (WAF/CDN).
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-6000}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-1000}

      # ── WebRTC calls ───────────────────────────────────────────
      # STUN/TURN list pushed to every peer in the WS `registered`
      # frame. Managed by turn.sh (coturn runs as a sibling host-
      # networked container). WITHOUT a TURN relay, peers behind
      # CGNAT (5G ↔ home WiFi) can almost never connect — calls sit
      # on "connecting" until they time out.
      - AUDIO_CALL_ICE_SERVERS=${AUDIO_CALL_ICE_SERVERS:-}
      # FCM service-account JSON (single line) — when set, incoming
      # call rings ALSO wake closed/force-stopped apps via push.
      # Empty = push disabled (WS ring + Android duty mode still work).
      - FCM_CREDENTIALS_JSON=${FCM_CREDENTIALS_JSON:-}

      # ── Payments / contact ──────────────────────────────────────
      - PAYMENT_PUBLIC_BASE_URL=${PAYMENT_PUBLIC_BASE_URL:-https://datxevui.com}

      # ── Cache / worker: single-node production uses in-process cache
      #    and the DB-backed queue. Redis is intentionally not required.
      - CACHE_BACKEND=${CACHE_BACKEND:-moka}
      - WORKER_BACKEND=${WORKER_BACKEND:-db}

      # Everything else (STATIC_FILES_DIR, SEARCH_INDEX_DIR,
      # SEARCH_OSM_PBF_PATH, STORAGE_LOCAL_ROOT, SCHEDULER)
      # comes from the image defaults baked into the Dockerfile.

    volumes:
      # rust-sql DB file + OSM PBF downloads
      - vexevn-data:/app/data
      # Tantivy place-search index — the live index is NESTED at
      # /app/index/osm-index so the importer's sibling staging dir
      # (osm-index.staging) shares the volume filesystem and its
      # atomic rename never hits EXDEV. Do NOT flatten.
      - vexevn-index:/app/index
      # Local file uploads
      - vexevn-storage:/app/storage

    networks:
      - pdf-tts

    deploy:
      replicas: 1
      # rust-sql DB file + local volumes pin the app to the manager node.
      placement:
        constraints:
          - node.role == manager
      resources:
        # NO hard limits (operator decision 2026-09-10): the backend may
        # burst to whatever the 4 vCPU / 8 GB shared node can give, and
        # pdf-tts (co-tenant) is uncapped the same way. Two side effects
        # of the old 1.5-cpu cap, both fixed by removing it:
        #   1. tokio sized its worker pool from the cgroup value
        #      (2 workers) — a single blocked task could stall the whole
        #      runtime and fail /health (the "unreachable after hangup"
        #      incidents of 2026-09-09); with all 4 vCPUs visible the
        #      pool grows to 4 workers and a one-task hang cannot take
        #      the server down with it.
        #   2. memory headroom for the Tantivy import / search paths is
        #      no longer clipped at 2g.
        # The 192m reservation is scheduling-only metadata (single-node
        # swarm — no effect); keep it for documentation value.
        reservations:
          memory: 192m
      # One replica + single-writer engine: never two containers on the same DB file.
      update_config:
        parallelism: 1
        order: stop-first
        delay: 10s
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
        window: 30s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── RustFS (S3-compatible object storage for route media) ───────
  # Rust-native, Apache-2.0, drop-in MinIO alternative (rustfs.com).
  # Single node is fine for route pictures. NO published ports: the
  # backend reaches it at rustfs:9000 (stack-local alias), the shared
  # Caddy at datxevui_rustfs:9000 (overlay DNS). The web console
  # (:9001) is reachable over an SSH tunnel to the task's container
  # IP (see deploy/README.md § route media).
  # One-time setup (bucket + public-read policy so GETs — and only
  # GETs — work without signatures). NOTE: minio/mc's ENTRYPOINT is
  # `mc`, so the shell MUST be selected via --entrypoint:
  #   docker run --rm --network pdf-tts_pdf-tts --entrypoint sh \
  #     -e RUSTFS_ACCESS_KEY -e RUSTFS_SECRET_KEY minio/mc -c '
  #     mc alias set r http://datxevui_rustfs:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" &&
  #     mc mb r/datxevui-media && mc anonymous set download r/datxevui-media'
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required in .env}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required in .env}
    volumes:
      - rustfs-data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        # Media objects are small (route pictures + thumbnails);
        # 256m reservation documents the working set, NO hard limit
        # (same operator policy as backend + pdf-tts).
        reservations:
          memory: 256m
      restart_policy:
        condition: any
        delay: 5s
        window: 30s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pdf-tts

networks:
  pdf-tts:
    # The overlay network created by the pdf-tts stack (attachable,
    # swarm-scoped). External so this stack attaches to it instead of
    # creating its own — the shared Caddy proxies to
    # datxevui_backend:8080 (app) and datxevui_rustfs:9000 (media).
    external: true
    name: pdf-tts_pdf-tts

volumes:
  # NOTE: these keys keep the historic "vexevn-" prefix ON PURPOSE. They
  # are STACK-SCOPED: with STACK=datxevui the live volumes are
  # datxevui_vexevn-data / datxevui_vexevn-index / datxevui_vexevn-storage
  # and they hold the production data (migrated 2026-09-08 after the
  # vexevn→datxevui stack rename silently created fresh empty volumes).
  # RENAMING THESE KEYS WOULD ORPHAN THAT DATA — do not rename.
  vexevn-data:
  vexevn-index:
  vexevn-storage:
  # Route-picture objects (originals + JPEG thumbnails). Content-
  # addressed keys — safe to wipe ONLY together with the route_picture
  # table (the rows are the only index of these objects).
  rustfs-data:
