# ─── Docker Compose for production deployment ──────────────────────────
#
# Usage:
#   docker compose up -d              # start all services
#   docker compose logs -f backend    # tail backend logs
#   docker compose down               # stop all
#
# This compose file runs:
#   - backend    (this app — Rust + frontend static files)
#   - redis      (cache + worker queue)
#
# The database is the rust-sql (rustqlite) engine — compiled INTO the
# backend binary (no C SQLite, no postgres container). Data persists
# in the `appdata` volume (/app/data).
#
# The backend runs migrations on startup, so the first `up` will create
# all tables. Swagger UI at http://localhost:8080/swagger-ui.
#
# NullClaw is configured via env vars pointing at the nullclaw service.
# If you don't have a NullClaw instance, set NULLCLAW_ENABLED=false
# (the default) — the chat will work without AI replies; admin will
# handle all messages manually.

services:
  # ── Cache + Worker queue (Redis) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend (this app) ───────────────────────────────────────────
  # The rust-sql (rustqlite) engine is linked into the binary — no
  # database container, no feature flags.
  backend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # ── Database (rust-sql engine, file-backed) ────────────────
      DATABASE_URL: sqlite:///app/data/app.db?mode=rwc
      DATABASE_MAX_CONNECTIONS: "20"
      DATABASE_MIN_CONNECTIONS: "5"

      # ── Cache + Worker ─────────────────────────────────────────
      CACHE_BACKEND: redis
      CACHE_REDIS_URL: redis://redis:6379/0
      WORKER_BACKEND: redis
      WORKER_REDIS_URL: redis://redis:6379/1

      # ── JWT ────────────────────────────────────────────────────
      # MUST be at least 32 bytes! Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-32-bytes-or-more}

      # ── Cookies ────────────────────────────────────────────────
      # Leave COOKIE_DOMAIN empty for same-origin (Rust serves UI + API).
      # Set COOKIE_SECURE=true in production (behind HTTPS).
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax

      # ── CORS ───────────────────────────────────────────────────
      # Same-origin in production — no CORS needed. Leave for dev only.
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8080"

      # ── Static files ───────────────────────────────────────────
      STATIC_FILES_DIR: "./frontend/dist"
      STATIC_FILES_CACHE_MAX_AGE: "86400"

      # ── Rate limiting ──────────────────────────────────────────
      RATE_LIMIT_RPM: "600"
      RATE_LIMIT_BURST: "100"

      # ── WebSocket ──────────────────────────────────────────────
      WS_MAX_CONNECTIONS: "50000"
      WS_HEARTBEAT_SEC: "30"
      WS_IDLE_TIMEOUT_SEC: "90"

      # ── NullClaw AI ────────────────────────────────────────────
      # Disabled by default. Set NULLCLAW_API_URL + NULLCLAW_API_KEY
      # to enable AI replies when no admin is online.
      NULLCLAW_ENABLED: "${NULLCLAW_ENABLED:-false}"
      NULLCLAW_API_URL: "${NULLCLAW_API_URL:-}"
      NULLCLAW_API_KEY: "${NULLCLAW_API_KEY:-}"
      NULLCLAW_MODEL: "${NULLCLAW_MODEL:-nullclaw-default}"
      NULLCLAW_TIMEOUT_MS: "15000"
      NULLCLAW_MAX_HISTORY: "12"
      NULLCLAW_FALLBACK_ONLINE_EMPLOYEES: "1"

      # ── Audio call (WebRTC) ────────────────────────────────────
      AUDIO_CALL_ENABLED: "false"

      # ── OAuth (social login) ──────────────────────────────────
      OAUTH_REDIRECT_BASE_URL: "${OAUTH_REDIRECT_BASE_URL:-http://localhost:8080}"
      OAUTH_FRONTEND_URL: "${OAUTH_FRONTEND_URL:-http://localhost:8080}"
      OAUTH_FACEBOOK_ENABLED: "false"
      OAUTH_GOOGLE_ENABLED: "false"
      OAUTH_TWITTER_ENABLED: "false"

      # ── Logging ───────────────────────────────────────────────
      RUST_LOG: "info,backend=debug,tower_http=warn"
    volumes:
      # Persist uploaded files (avatars, etc.)
      - uploads:/app/storage
      # Persist the rust-sql database file (+ WAL)
      - appdata:/app/data

volumes:
  appdata:
  uploads:
