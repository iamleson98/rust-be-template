# cargo-deny — dependency policy gate (CI: `cargo deny check advisories
# bans licenses sources`).
#
# Layers on top of the separate cargo-audit job: same RustSec advisory
# DB, but also enforces LICENSE allow-listing (no copyleft surprises),
# bans wildcard version deps, and denies any dependency source that is
# not crates.io or an in-repo path (the rust-sql engine + its compat
# crates are path patches — allowed by design).
#
# Fix recipes:
#  - new advisory        → upgrade the flagged crate; only add an
#                          `ignore` entry with a dated reason if the
#                          fix is genuinely blocked.
#  - new license flavor  → add the SPDX id to [licenses].allow IF it
#                          is permissive (MIT/Apache/BSD/ISC/Zlib/
#                          Unicode/CC0/CDLA-Permissive/MPL-2.0 class).
#                          Copyleft (GPL/LGPL/AGPL/SSPL) = deny forever.
#  - multiple-versions   → warnings only (the tree is huge); fix opportunistically.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[advisories]
# Every advisory (vulnerability, unmaintained, unsound, yanked) is an
# error by default — exactly the strictness we want. `ignore` is the
# pressure-release valve. The entries below mirror .cargo/audit.toml
# (the cargo-audit job's config) so both advisory gates share ONE
# documented, justified policy — keep them in sync by hand.
ignore = [
    # rsa 0.9.10 — Marvin Attack (timing sidechannel, medium 5.9).
    # NOT compiled into the binary: enters Cargo.lock only as a possible
    # optional dependency of sqlx's *mysql* feature, which we never
    # enable. Upstream has NO fixed version. Revisit: sqlx prunes the
    # mysql chain or rsa ships a patch.
    { id = "RUSTSEC-2023-0071", reason = "not linked (sqlx mysql feature off); no upstream fix exists" },

    # lru 0.12.5 — UAF in LruCache::pop() + Stacked-Borrows violation in
    # IterMut; fixed only in lru 0.16.3/0.18.2, tantivy 0.22 pins ^0.12.
    # We only touch lru through tantivy (search index).
    { id = "RUSTSEC-2026-0253", reason = "tantivy 0.22 pins lru ^0.12; pop()/IterMut never called by us" },
    { id = "RUSTSEC-2026-0002", reason = "tantivy 0.22 pins lru ^0.12; pop()/IterMut never called by us" },

    # memmap2 0.5.10 — unchecked pointer offset (unsound). Fixed only in
    # 0.9.11; osmpbf 0.3.8 pins memmap2 ^0.5. Revisit: osmpbf release
    # with a newer memmap2.
    { id = "RUSTSEC-2026-0186", reason = "osmpbf 0.3.8 pins memmap2 ^0.5; fixed only in 0.9.11" },

    # instant 0.1.13 — unmaintained (no vuln), pulled by measure_time
    # via tantivy 0.22. No fixed version exists.
    { id = "RUSTSEC-2024-0384", reason = "unmaintained transitive via tantivy->measure_time; no replacement reachable" },

    # i_tree 0.8.3 — OOB access via public node accessors. Fixed in
    # i_tree 0.10, which requires i_overlay 7+ / geo 0.30+ (major bump
    # of the geo stack). Revisit: geo >0.29.
    { id = "RUSTSEC-2025-0165", reason = "fix requires geo 0.30+ major bump; revisit when geo >0.29" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-1.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "MPL-2.0",
    "BlueOak-1.0.0",
]

[bans]
multiple-versions = "warn"
highlight = "all"
wildcards = "deny"
# No explicit `deny` crate list — copyleft is rejected implicitly: a
# license not on [licenses].allow fails the licenses check above.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
